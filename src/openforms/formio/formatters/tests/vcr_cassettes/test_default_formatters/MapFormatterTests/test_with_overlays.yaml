    body:
      string: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<WMS_Capabilities xmlns=\"http://www.opengis.net/wms\"
        xmlns:sld=\"http://www.opengis.net/sld\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"
        xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:inspire_common=\"http://inspire.ec.europa.eu/schemas/common/1.0\"
        xmlns:inspire_vs=\"http://inspire.ec.europa.eu/schemas/inspire_vs/1.0\" version=\"1.3.0\"
        xsi:schemaLocation=\"http://www.opengis.net/wms http://schemas.opengis.net/wms/1.3.0/capabilities_1_3_0.xsd
        http://www.opengis.net/sld http://schemas.opengis.net/sld/1.1.0/sld_capabilities.xsd
        http://inspire.ec.europa.eu/schemas/inspire_vs/1.0 http://inspire.ec.europa.eu/schemas/inspire_vs/1.0/inspire_vs.xsd\">\n\t<Service>\n\t\t<Name>WMS</Name>\n\t\t<Title>BRO
        Model Grondwaterspiegeldiepte (WDM) WMS</Title>\n\t\t<Abstract>Het grondwaterspiegeldieptemodel
        maakt deel uit van de Basisregistratieondergrond (BRO). Het bestaat uit een
        aantal grondwaterkarakteristieken die samen de langjarig gemiddelde fluctuatiedieptes
        van de grondwaterspiegel weergegeven. Deze statistieken zijn de gemiddelde
        kleinste grondwaterspiegeldiepte (GHG), de gemiddelde grootste grondwaterspiegeldiepte
        (GLG), en de daarvan afgeleide grondwatertrap (Gt). De grondwatertrap maakte
        tot voor kort deel uit van een ander registratieobject, te weten de Bodemkaart
        van Nederland schaal 1:50000. Voor onder meer ecologische toepassingen is
        ook de gemiddelde voorjaarsgrondwaterspiegeldiepte (GVG) aan het grondwaterspiegeldieptemodel
        toegevoegd.</Abstract>\n\t\t<KeywordList>\n\t\t\t<Keyword>Geologie</Keyword>\n\t\t\t<Keyword>Bodem</Keyword>\n\t\t\t<Keyword>Geomorfologie</Keyword>\n\t\t\t<Keyword>Geohydrologie</Keyword>\n\t\t\t<Keyword>infoMapAccessService</Keyword>\n\t\t</KeywordList>\n\t\t<OnlineResource
