        Grondwaterspiegeldiepte GVG</Title>\n\t\t\t\t<Abstract>Het grondwaterspiegeldieptemodel
        maakt deel uit van de Basisregistratieondergrond (BRO). Het bestaat uit een
        aantal grondwaterkarakteristieken die samen de langjarig gemiddelde fluctuatiedieptes
        van de grondwaterspiegel weergegeven. E\xE9n van die karakteristieken in het
        grondwaterspiegeldieptemodel is \u2018Gemiddelde Voorjaars Grondwaterspiegeldiepte
        (GVG). Voor onder meer ecologische toepassingen is ook de gemiddelde voorjaarsgrondwaterspiegeldiepte
        (GVG) aan het grondwaterspiegeldieptemodel toegevoegd. Deze laag bevat de
        waarden hiervoor in cm onder maaiveld.</Abstract>\n\t\t\t\t<KeywordList>\n\t\t\t\t\t<Keyword>Geologie</Keyword>\n\t\t\t\t\t<Keyword>Bodem</Keyword>\n\t\t\t\t\t<Keyword>Geomorfologie</Keyword>\n\t\t\t\t\t<Keyword>Geohydrologie</Keyword>\n\t\t\t\t</KeywordList>\n\t\t\t\t<CRS>EPSG:28992</CRS>\n\t\t\t\t<CRS>EPSG:25831</CRS>\n\t\t\t\t<CRS>EPSG:25832</CRS>\n\t\t\t\t<CRS>EPSG:3034</CRS>\n\t\t\t\t<CRS>EPSG:3035</CRS>\n\t\t\t\t<CRS>EPSG:3857</CRS>\n\t\t\t\t<CRS>EPSG:4258</CRS>\n\t\t\t\t<CRS>EPSG:4326</CRS>\n\t\t\t\t<CRS>CRS:84</CRS>\n\t\t\t\t<EX_GeographicBoundingBox>\n\t\t\t\t\t<westBoundLongitude>2.52713</westBoundLongitude>\n\t\t\t\t\t<eastBoundLongitude>7.37403</eastBoundLongitude>\n\t\t\t\t\t<southBoundLatitude>50.2129</southBoundLatitude>\n\t\t\t\t\t<northBoundLatitude>55.7212</northBoundLatitude>\n\t\t\t\t</EX_GeographicBoundingBox>\n\t\t\t\t<BoundingBox
